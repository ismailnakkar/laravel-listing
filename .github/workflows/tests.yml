name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole grid, on pull requests and when run by hand before a tag. A push to main runs only `newest`.
  sqlite:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        deps: [prefer-lowest, prefer-stable]

    name: &name SQLite · PHP ${{ matrix.php }} · ${{ matrix.deps }}

    steps: &steps
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Laravel 13.0, the prefer-lowest floor, has advisories; only advisory blocking is turned off.
      - run: composer update --${{ matrix.deps }} --prefer-dist --no-interaction --no-progress
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: ${{ matrix.deps == 'prefer-lowest' && '0' || '1' }}

      - run: composer ${{ matrix.php == '8.5' && matrix.deps == 'prefer-stable' && 'check' || 'test' }}

  # A push to main: the grid's newest row, which also runs the rest of the check.
  newest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { php: '8.5', deps: prefer-stable }
    name: *name
    steps: *steps

  database:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - connection: pgsql
            image: postgres:18
            port: 5432
            username: postgres
            health: pg_isready
          - connection: mariadb
            image: mariadb:11.8
            port: 3306
            username: root
            health: healthcheck.sh --connect --innodb_initialized
          - connection: mysql
            image: mysql:8.4
            port: 3306
            username: root
            health: mysqladmin ping -h 127.0.0.1 -psecret

    name: ${{ matrix.connection }} · PHP 8.5 · prefer-stable

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: listing
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: listing
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, pdo_mysql
          coverage: none

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/phpunit
        env:
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.port }}
          DB_DATABASE: listing
          DB_USERNAME: ${{ matrix.username }}
          DB_PASSWORD: secret
